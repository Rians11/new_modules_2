<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<!--
  KLP STUDIO — RESCHEDULE BY CALENDAR  (Odoo 18 public page, demo shell)
  Logo identity: round KLP Studio mark (K red / L ink / P gold, white pastille) — same as the enrollment module.

  CROSS-AVAILABILITY ENGINE (the core):
  A slot is offered only if it satisfies ALL constraints:
    . school opening hours (+ closed weekdays)   09:00–19:00, Sunday closed
    . role PARENT  : teacher's calendar free  ∩  compatible ROOM free
    . role TEACHER : student's calendar free   ∩  compatible ROOM free
    . declared teacher availability window (when present)

  ODOO INTEGRATION:
  - GET /klp/reschedule/<token>
      token -> klp.parent.lesson.confirmation (parent) OR
               klp.teacher.daily.confirmation (teacher)  => ROLE is server-known.
      No parent/teacher switch in the UI: the role is fixed by the token.
  - JSON /slots   : days + slots for the visible month, window J+1 .. J+35
  - JSON /confirm : atomic write start/stop on the existing calendar.event,
                    chatter message_post, anti-collision re-check, WhatsApp notify.
  This single file is a self-contained visual/UX demo of that page.
  NOTE: this is a one-time tokenised link, not a website — no footer.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLP Studio — Reschedule your session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8102E; --red-deep:#9C0A23; --red-soft:#FCEDEF; --red-lip:#7E0819;
  --gold:#C9A227; --gold-deep:#A8861B; --gold-soft:#FBF4DE;
  --ink:#17161A; --muted:#6B6770; --bg:#EFEDEF; --card:#FFFFFF;
  --line:#E4E0E5; --field:#F4F2F5; --ok:#1F7A4D;
  --r:16px;
  --press:cubic-bezier(.34,1.56,.64,1);
  /* soft, quiet depth — one gentle shadow */
  --d-amb:0 1px 2px rgba(23,22,26,.04);
  --d-key:0 14px 34px -20px rgba(23,22,26,.22);
  --d-card:0 1px 3px rgba(23,22,26,.04), 0 16px 40px -28px rgba(23,22,26,.30);
  --hi:inset 0 0 0 rgba(0,0,0,0);                   /* no gloss (kept for valid syntax) */
  --surf:var(--card);
}
[data-theme="dark"]{
  --red:#E5304B; --red-deep:#C8102E; --red-soft:#2A171B; --red-lip:#7C0F1F;
  --gold:#D9B544; --gold-deep:#C9A227; --gold-soft:#262012;
  --ink:#F3F1F3; --muted:#9D97A1; --bg:#0B0A0D; --card:#171519;
  --line:#2C2830; --field:#100E13; --ok:#5BC08C;
  --d-amb:0 1px 2px rgba(0,0,0,.4);
  --d-key:0 14px 38px -20px rgba(0,0,0,.6);
  --d-card:0 1px 3px rgba(0,0,0,.4), 0 18px 44px -28px rgba(0,0,0,.65);
  --hi:inset 0 0 0 rgba(0,0,0,0);
  --surf:var(--card);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip;max-width:100%}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:
  radial-gradient(1100px 540px at 50% -180px,color-mix(in srgb,var(--red) 9%,transparent),transparent 70%),
  var(--bg);color:var(--ink);transition:background .3s,color .3s;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
main{flex:1 0 auto}
img,svg{max-width:100%}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 60%,transparent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
.tri{height:4px;background:linear-gradient(90deg,var(--red) 0 34%,var(--ink) 34% 67%,var(--gold) 67% 100%);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ===== ROUND LOGO (inline SVG = KLP Studio mark, identical to enrollment module) ===== */
.klp-logo{flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.klp-logo .disc{fill:#FFFFFF}
.klp-logo .ring{stroke:rgba(23,22,26,.06);stroke-width:1.5;fill:none}

/* ===== HEADER ===== */
.top{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(140%) blur(12px);position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(0,0,0,.5)}
.toprow{display:flex;align-items:center;gap:12px;padding:11px 0;min-width:0}
.brand{line-height:1.05;margin-right:auto;white-space:nowrap;min-width:0;overflow:hidden}
.brand .l1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1rem,3vw,1.2rem);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis}
.brand .l1 .k{color:var(--red)}.brand .l1 .l{color:var(--ink)}.brand .l1 .p{color:var(--gold)}
.brand .l2{font-size:clamp(.47rem,1.6vw,.59rem);font-weight:700;letter-spacing:.26em;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
@media(max-width:360px){.brand .l2{display:none}}
.tbtn{flex:none;width:44px;height:40px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s}
.tbtn:hover{background:var(--field);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.tbtn svg{width:18px;height:18px}
.ico-moon{display:block}.ico-sun{display:none}
[data-theme="dark"] .ico-moon{display:none}[data-theme="dark"] .ico-sun{display:block}

/* ===== HERO ===== */
.band{position:relative;color:#fff;text-align:center;padding:46px 18px 50px;
  background:linear-gradient(135deg,var(--red-deep),var(--red) 80%)}
.band .orb{display:none}
.band h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.35rem,4.2vw,2.05rem);letter-spacing:-.01em}
.band p{font-size:.66rem;letter-spacing:.34em;font-weight:700;opacity:.9;padding-top:10px}

/* ===== BODY ===== */
main{padding:44px 0 160px}
@media(min-width:880px){main{padding:68px 0 96px}}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:880px){.grid{grid-template-columns:1.7fr 1fr;gap:26px;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--d-card);padding:26px}
@media(min-width:880px){.card{padding:32px}}

.session{position:relative;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:18px 20px;margin-bottom:22px;background:var(--field)}
.session .tag{display:inline-block;font-size:.59rem;font-weight:800;letter-spacing:.2em;color:var(--red);
  border:1px solid color-mix(in srgb,var(--red) 55%,transparent);border-radius:99px;padding:4px 10px;margin-bottom:10px;
  background:color-mix(in srgb,var(--red) 8%,transparent)}
.session .stu{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.28rem}
.session .ln{color:var(--muted);font-size:.88rem;margin-top:3px}
.session .wh{font-weight:700;font-size:.92rem;margin-top:10px;font-variant-numeric:tabular-nums}
.session .wh s{color:var(--red)}

.rolenote{font-size:.82rem;color:var(--muted);line-height:1.6;padding:2px 0 18px;display:flex;gap:9px}
.rolenote svg{flex:none;width:17px;height:17px;margin-top:2px;fill:var(--red)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px}
.cal-head b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.08rem}
.navb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:1.1rem;
  transition:background .15s,border-color .15s,color .15s}
.navb:hover:not(:disabled){background:var(--field);color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.navb:disabled{opacity:.3;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dow{text-align:center;font-size:.66rem;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:4px 0 10px}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);
  font-weight:500;font-size:.95rem;position:relative;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;opacity:.45;-webkit-appearance:none;appearance:none}
.day.av{cursor:pointer;opacity:1;color:var(--ink);background:var(--field);
  transition:background .15s,color .15s,box-shadow .15s}
.day.av:hover{background:color-mix(in srgb,var(--red) 11%,var(--field));color:var(--red)}
.day.av::after{content:"";position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--red)}
.day.sel,.day.sel:hover{background:var(--red);color:#fff;font-weight:700;box-shadow:0 8px 18px -8px rgba(200,16,46,.55)}
.day.sel::after{background:rgba(255,255,255,.92)}
.day.old{opacity:1;color:var(--red);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.legend{display:flex;flex-wrap:wrap;gap:18px;padding-top:18px;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.legend s{color:var(--red);font-weight:700}

/* right panel */
.side h3{font-size:.67rem;font-weight:800;letter-spacing:.22em;color:var(--red);padding-bottom:11px}
.dt{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.05rem;padding-bottom:11px}
.checks{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:14px}
.checks span{font-size:.69rem;font-weight:700;border-radius:99px;padding:5px 11px;
  background:var(--gold-soft);color:var(--gold-deep);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
[data-theme="dark"] .checks span{color:var(--gold)}
.slots{display:flex;flex-direction:column;gap:10px;max-height:312px;overflow-y:auto;padding-right:2px}
.slot{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:600;font-size:.95rem;
